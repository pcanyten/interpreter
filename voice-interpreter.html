<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>포켓 통역기 · 음성</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one phone screen split in two. Bottom half faces the owner; top half is rotated 180°
     so a person sitting across the table reads, speaks and types in their own orientation. */
  :root {
    --me-bg: #e9f1ee; --me-surface: #ffffff; --me-fg: #10211d; --me-muted: #5d6f6a;
    --me-accent: #0e7c66; --me-accent-fg: #ffffff; --me-line: #c9d8d3;
    --them-bg: #f5ede2; --them-surface: #ffffff; --them-fg: #241a10; --them-muted: #7a6a58;
    --them-accent: #b4621e; --them-accent-fg: #ffffff; --them-line: #e2d3bf;
    --bar-bg: #1b2a27; --bar-fg: #e6efec; --bar-muted: #9bb0aa; --danger: #b0352c; --live: #d6453a;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --me-bg: #0f1a18; --me-surface: #182623; --me-fg: #e4efeb; --me-muted: #8fa5a0;
      --me-accent: #3fc8a5; --me-accent-fg: #06201a; --me-line: #27403a;
      --them-bg: #1c1612; --them-surface: #28201a; --them-fg: #f1e7da; --them-muted: #b09a84;
      --them-accent: #e8a458; --them-accent-fg: #2a1a08; --them-line: #45362a;
      --bar-bg: #060b0a; --bar-fg: #e6efec; --bar-muted: #7e938d; --danger: #ff7b6e; --live: #ff6a5e;
      color-scheme: dark;
    }
  }

  html { height: 100%; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%; margin: 0; overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bar-bg); color: var(--me-fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.45;
    -webkit-text-size-adjust: 100%; touch-action: manipulation;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  [hidden] { display: none !important; }

  .app { height: 100%; display: flex; flex-direction: column; }

  .panel {
    flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; padding-inline: 16px;
    transition: flex-grow .25s ease;
  }
  .panel.them {
    background: var(--them-bg); color: var(--them-fg); transform: rotate(180deg);
    --p-surface: var(--them-surface); --p-fg: var(--them-fg); --p-muted: var(--them-muted);
    --p-accent: var(--them-accent); --p-accent-fg: var(--them-accent-fg); --p-line: var(--them-line);
  }
  .panel.me {
    background: var(--me-bg); color: var(--me-fg);
    --p-surface: var(--me-surface); --p-fg: var(--me-fg); --p-muted: var(--me-muted);
    --p-accent: var(--me-accent); --p-accent-fg: var(--me-accent-fg); --p-line: var(--me-line);
  }
  .app.kb-them .panel.them { flex-grow: 1.7; }
  .app.kb-me .panel.me { flex-grow: 1.7; }

  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 8px 4px; min-height: 36px; }
  .lang-chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; }
  .lang-chip .code { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--p-accent-fg); background: var(--p-accent); padding: 2px 6px; border-radius: 4px; }
  .panel-head .hint { font-size: 12px; color: var(--p-muted); font-family: var(--font-mono); letter-spacing: .02em; }
  .panel-head .hint.live { color: var(--live); font-weight: 500; }

  .log { flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 10px; padding-block: 4px 10px; -webkit-overflow-scrolling: touch; }
  .empty { margin: auto; max-width: 28ch; text-align: center; color: var(--p-muted); font-size: 14px; line-height: 1.5; text-wrap: balance; }

  .msg { display: flex; flex-direction: column; gap: 3px; max-width: 88%; padding: 10px 12px; border-radius: 14px; background: var(--p-surface); border: 1px solid var(--p-line); min-width: 0; word-break: break-word; overflow-wrap: anywhere; }
  .msg.own { align-self: flex-end; border-color: var(--p-accent); border-bottom-right-radius: 4px; }
  .msg.other { align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg .primary { font-size: 18px; line-height: 1.4; font-weight: 500; }
  .msg.other .primary { font-size: 20px; }
  .msg .secondary { font-size: 12.5px; color: var(--p-muted); line-height: 1.35; }
  .msg .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .msg .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--p-muted); letter-spacing: .04em; }
  .msg .meta.err { color: var(--danger); }
  .msg .meta.live { color: var(--live); }
  .msg.is-live { border-style: dashed; }
  .msg .actions { display: flex; gap: 4px; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--p-line); background: transparent; color: var(--p-muted); padding: 0; }
  .icon-btn:active { background: var(--p-line); }
  .icon-btn svg { width: 16px; height: 16px; }

  .dots { display: inline-flex; gap: 4px; align-items: center; height: 22px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--p-muted); opacity: .4; animation: blink 1.1s infinite; }
  .dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3 } 40% { opacity: 1 } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(214,69,58,.55) } 100% { box-shadow: 0 0 0 14px rgba(214,69,58,0) } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .7 } .panel { transition: none } .mic.on { animation: none } }

  .composer { display: flex; gap: 8px; align-items: center; padding-block: 8px 12px; }
  .composer input { flex: 1 1 0; min-width: 0; height: 46px; padding: 0 14px; border-radius: 23px; border: 1.5px solid var(--p-line); background: var(--p-surface); font-size: 17px; }
  .composer input::placeholder { color: var(--p-muted); }
  .composer input.interim { color: var(--p-muted); font-style: italic; }
  .composer input:focus { border-color: var(--p-accent); outline: none; }
  .send, .mic { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; border: 0; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .send { background: var(--p-accent); color: var(--p-accent-fg); }
  .send svg { width: 22px; height: 22px; }
  .mic { width: 56px; height: 56px; background: var(--p-surface); color: var(--p-fg); border: 1.5px solid var(--p-line); }
  .mic svg { width: 26px; height: 26px; }
  .mic.on { background: var(--live); color: #fff; border-color: var(--live); animation: pulse 1.4s infinite; }
  .mic:disabled { opacity: .4; cursor: default; }

  .bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bar-bg); color: var(--bar-fg); min-height: 44px; }
  .bar .pair { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .bar .pair .arrow { color: var(--bar-muted); }
  .bar select { flex: 1 1 auto; min-width: 0; height: 32px; padding: 0 8px; background: transparent; border: 1px solid var(--bar-muted); border-radius: 8px; color: var(--bar-fg); font-size: 13px; font-weight: 500; }
  .bar .status { font-family: var(--font-mono); font-size: 10.5px; color: var(--bar-muted); white-space: nowrap; letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  .bar .status.warn { color: #ffd27a; }
  .bar .bar-btn { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--bar-muted); background: transparent; color: var(--bar-fg); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .bar .bar-btn svg { width: 17px; height: 17px; }
  .bar .bar-btn.attn { border-color: #ffd27a; color: #ffd27a; }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--me-surface); color: var(--me-fg); border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 88%; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -8px 30px rgba(0,0,0,.25); }
  .sheet h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--me-line); margin: -6px auto 0; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 500; color: var(--me-muted); letter-spacing: .02em; }
  .field select, .field input[type="password"], .field input[type="text"] { height: 44px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--me-line); background: var(--me-bg); font-size: 15px; width: 100%; }
  .two { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
  .swap-btn { height: 44px; width: 44px; border-radius: 10px; border: 1.5px solid var(--me-line); background: var(--me-bg); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .swap-btn svg { width: 18px; height: 18px; }
  .models { display: flex; flex-direction: column; gap: 6px; }
  .model { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--me-line); background: var(--me-bg); text-align: left; }
  .model[aria-checked="true"] { border-color: var(--me-accent); }
  .model .radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--me-muted); }
  .model[aria-checked="true"] .radio { border-color: var(--me-accent); background: var(--me-accent); box-shadow: inset 0 0 0 3px var(--me-bg); }
  .model .name { font-weight: 700; font-size: 15px; }
  .model .note { font-size: 12px; color: var(--me-muted); }
  .model .lat { font-family: var(--font-mono); font-size: 11px; color: var(--me-muted); letter-spacing: .04em; white-space: nowrap; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--me-line); background: var(--me-bg); }
  .toggle .t { font-weight: 600; font-size: 15px; }
  .toggle .d { font-size: 12px; color: var(--me-muted); }
  .switch { position: relative; width: 48px; height: 28px; border-radius: 14px; background: var(--me-line); border: 0; flex: 0 0 auto; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--me-surface); transition: left .15s; }
  .switch[aria-checked="true"] { background: var(--me-accent); }
  .switch[aria-checked="true"]::after { left: 23px; }
  .sheet-actions { display: flex; gap: 8px; }
  .btn { flex: 1 1 0; height: 46px; border-radius: 12px; border: 1.5px solid var(--me-line); background: var(--me-bg); font-weight: 600; }
  .btn.primary { background: var(--me-accent); color: var(--me-accent-fg); border-color: var(--me-accent); }
  .btn.danger { color: var(--danger); }
  .fine { font-size: 12px; color: var(--me-muted); line-height: 1.45; margin: 0; }
  .fine a { color: var(--me-accent); }
</style>
</head>
<body>
<div class="app" id="app">
  <section class="panel them" id="panelThem" aria-label="Partner side">
    <div class="panel-head">
      <span class="lang-chip"><span class="code" id="codeThem">JA</span><span id="nameThem">日本語</span></span>
      <span class="hint" id="hintThem"></span>
    </div>
    <div class="log" id="logThem"></div>
    <form class="composer" id="formThem" autocomplete="off">
      <button type="button" class="mic" id="micThem" aria-label="Speak" data-owner="them">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8 21h8"/></svg>
      </button>
      <input type="text" id="inputThem" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" placeholder="メッセージを入力">
      <button type="submit" class="send" id="sendThem" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </form>
  </section>

  <div class="bar" id="bar">
    <span class="pair" title="v3"><span id="pairMe">KO</span><span class="arrow">⇄</span><span id="pairThem">JA</span><span class="arrow">v4</span></span>
    <select id="modelQuick" aria-label="번역 모델"></select>
    <span class="status" id="status"></span>
    <button type="button" class="bar-btn" id="resetChat" aria-label="대화 초기화">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    </button>
    <button type="button" class="bar-btn" id="openSettings" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <section class="panel me" id="panelMe" aria-label="내 쪽">
    <div class="panel-head">
      <span class="lang-chip"><span class="code" id="codeMe">KO</span><span id="nameMe">한국어</span></span>
      <span class="hint" id="hintMe"></span>
    </div>
    <div class="log" id="logMe"></div>
    <form class="composer" id="formMe" autocomplete="off">
      <button type="button" class="mic" id="micMe" aria-label="말하기" data-owner="me">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8 21h8"/></svg>
      </button>
      <input type="text" id="inputMe" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" placeholder="메시지를 입력하세요">
      <button type="submit" class="send" id="sendMe" aria-label="보내기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </form>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-labelledby="sheetTitle">
  <div class="grip"></div>
  <h2 id="sheetTitle">설정</h2>

  <div class="field">
    <label for="apiKey">Anthropic API 키</label>
    <input type="password" id="apiKey" placeholder="sk-ant-…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p class="fine">키는 이 브라우저에만 저장되고 Anthropic API로만 전송됩니다. <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>에서 발급.</p>
  </div>

  <div class="two">
    <div class="field">
      <label for="selMe">내 언어 (아래 화면)</label>
      <select id="selMe"></select>
    </div>
    <button type="button" class="swap-btn" id="swapLang" aria-label="언어 바꾸기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4m0 0L3 8m4-4 4 4"/><path d="M17 8v12m0 0 4-4m-4 4-4-4"/></svg>
    </button>
    <div class="field">
      <label for="selThem">상대 언어 (위 화면)</label>
      <select id="selThem"></select>
    </div>
  </div>

  <div class="field">
    <label>번역 모델</label>
    <div class="models" id="models" role="radiogroup"></div>
  </div>

  <div class="toggle">
    <span><span class="t">번역 자동 읽어주기</span><br><span class="d">상대방 화면에 뜬 번역을 음성으로 재생. 재생 중엔 마이크를 잠시 멈춥니다.</span></span>
    <button type="button" class="switch" id="autoSpeak" role="switch" aria-checked="true" aria-label="번역 자동 읽어주기"></button>
  </div>

  <div class="toggle">
    <span><span class="t">대화 모드 (마이크 자동 교대)</span><br><span class="d">내 말이 번역되어 읽히면 마이크가 상대 쪽으로 넘어가고, 상대가 말하면 다시 내 쪽으로 돌아옵니다.</span></span>
    <button type="button" class="switch" id="autoTurn" role="switch" aria-checked="true" aria-label="대화 모드"></button>
  </div>

  <p class="fine" id="srSupport"></p>

  <div class="sheet-actions">
    <button type="button" class="btn danger" id="clearChat">대화 지우기</button>
    <button type="button" class="btn primary" id="closeSettings">완료</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const LANGS = [
    { code: 'ko', name: '한국어',        tts: 'ko-KR', ph: '메시지를 입력하세요',          empty: '마이크를 누르고 말하거나 아래에 입력하면 상대방 화면에 번역되어 나타납니다.' },
    { code: 'en', name: 'English',       tts: 'en-US', ph: 'Type a message',               empty: 'Tap the mic and speak, or type below. Your words appear translated on the other side.' },
    { code: 'ja', name: '日本語',         tts: 'ja-JP', ph: 'メッセージを入力',              empty: 'マイクを押して話すか、下に入力してください。相手側の画面に翻訳されて表示されます。' },
    { code: 'zh-CN', name: '中文（简体）', tts: 'zh-CN', ph: '输入消息',                      empty: '按下麦克风说话，或在下方输入。译文会显示在对方的屏幕上。' },
    { code: 'zh-TW', name: '中文（繁體）', tts: 'zh-TW', ph: '輸入訊息',                      empty: '按下麥克風說話，或在下方輸入。譯文會顯示在對方的畫面上。' },
    { code: 'vi', name: 'Tiếng Việt',    tts: 'vi-VN', ph: 'Nhập tin nhắn',                empty: 'Nhấn micro và nói, hoặc nhập bên dưới. Lời của bạn sẽ được dịch cho người đối diện.' },
    { code: 'th', name: 'ไทย',           tts: 'th-TH', ph: 'พิมพ์ข้อความ',                 empty: 'แตะไมค์แล้วพูด หรือพิมพ์ด้านล่าง ข้อความจะถูกแปลให้อีกฝ่ายเห็น' },
    { code: 'id', name: 'Bahasa Indonesia', tts: 'id-ID', ph: 'Ketik pesan',               empty: 'Ketuk mikrofon dan bicara, atau ketik di bawah. Kata-kata Anda muncul terjemahan di sisi lain.' },
    { code: 'ms', name: 'Bahasa Melayu', tts: 'ms-MY', ph: 'Taip mesej',                   empty: 'Ketik mikrofon dan bercakap, atau taip di bawah.' },
    { code: 'es', name: 'Español',       tts: 'es-ES', ph: 'Escribe un mensaje',           empty: 'Toca el micrófono y habla, o escribe abajo. Tus palabras aparecen traducidas al otro lado.' },
    { code: 'fr', name: 'Français',      tts: 'fr-FR', ph: 'Écrivez un message',           empty: 'Appuyez sur le micro et parlez, ou écrivez ci-dessous.' },
    { code: 'de', name: 'Deutsch',       tts: 'de-DE', ph: 'Nachricht eingeben',           empty: 'Mikrofon antippen und sprechen, oder unten tippen.' },
    { code: 'it', name: 'Italiano',      tts: 'it-IT', ph: 'Scrivi un messaggio',          empty: 'Tocca il microfono e parla, o scrivi qui sotto.' },
    { code: 'pt', name: 'Português',     tts: 'pt-BR', ph: 'Digite uma mensagem',          empty: 'Toque no microfone e fale, ou digite abaixo.' },
    { code: 'ru', name: 'Русский',       tts: 'ru-RU', ph: 'Введите сообщение',            empty: 'Нажмите микрофон и говорите или напишите ниже.' },
    { code: 'tr', name: 'Türkçe',        tts: 'tr-TR', ph: 'Mesaj yazın',                  empty: 'Mikrofona dokunup konuşun veya aşağıya yazın.' },
    { code: 'ar', name: 'العربية',       tts: 'ar-SA', ph: 'اكتب رسالة',                   empty: 'اضغط على الميكروفون وتحدث، أو اكتب في الأسفل.' },
    { code: 'hi', name: 'हिन्दी',          tts: 'hi-IN', ph: 'संदेश लिखें',                   empty: 'माइक दबाकर बोलें या नीचे लिखें।' },
  ];
  const ENGLISH_NAME = {
    ko: 'Korean', en: 'English', ja: 'Japanese', 'zh-CN': 'Simplified Chinese (Mainland China)', 'zh-TW': 'Traditional Chinese (Taiwan)',
    vi: 'Vietnamese', th: 'Thai', id: 'Indonesian', ms: 'Malay', es: 'Spanish', fr: 'French', de: 'German', it: 'Italian',
    pt: 'Brazilian Portuguese', ru: 'Russian', tr: 'Turkish', ar: 'Arabic', hi: 'Hindi',
  };
  const MODELS = [
    { id: 'claude-haiku-5-5',  name: 'Haiku 5.5',  note: '가장 빠름. 일상 회화·길 안내·식당',        lat: '~1s' },
    { id: 'claude-sonnet-5-5', name: 'Sonnet 5.5', note: '균형. 비즈니스 표현, 존댓말 뉘앙스',        lat: '~2-4s' },
    { id: 'claude-opus-5-5',   name: 'Opus 5.5',   note: '가장 정확. 계약·기술 용어, 긴 문장',        lat: '~3-8s' },
    { id: 'claude-fable-5-1',  name: 'Fable 5.1',  note: '최상위 모델. 키 권한에 따라 오류가 날 수 있음', lat: '~3-8s' },
  ];

  const $ = (id) => document.getElementById(id);
  const langOf = (code) => LANGS.find((l) => l.code === code) || LANGS[1];
  const modelOf = (id) => MODELS.find((m) => m.id === id) || MODELS[0];

  // ---- state ----
  const S = { me: 'ko', them: 'ja', model: 'claude-haiku-5-5', key: '', autoSpeak: true, autoTurn: true };
  try {
    const saved = JSON.parse(localStorage.getItem('pi.voice.settings') || 'null');
    if (saved) {
      if (langOf(saved.me) && saved.me) S.me = saved.me;
      if (langOf(saved.them) && saved.them) S.them = saved.them;
      if (saved.model && MODELS.some((m) => m.id === saved.model)) S.model = saved.model;
      if (typeof saved.key === 'string') S.key = saved.key;
      if (typeof saved.autoSpeak === 'boolean') S.autoSpeak = saved.autoSpeak;
      if (typeof saved.autoTurn === 'boolean') S.autoTurn = saved.autoTurn;
    }
  } catch (e) { /* storage unavailable */ }
  function saveSettings() { try { localStorage.setItem('pi.voice.settings', JSON.stringify(S)); } catch (e) { /* ignore */ } }

  const messages = [];
  let seq = 0;

  // ---- translation via Anthropic API (streamed) ----
  const SYSTEM = 'You are a professional interpreter sitting between two people talking face to face on a business trip. ' +
    'Output ONLY the translation: no quotes, no notes, no alternatives, no explanation. Keep the meaning, tone and politeness level. ' +
    'Use natural spoken language the way a native speaker would say it in conversation. Keep numbers, names, prices and dates exactly as given. ' +
    'Speech-to-text input may lack punctuation or contain small recognition errors: infer the intended sentence. If the message is already in the target language, return it unchanged.';

  function userPrompt(srcCode, dstCode, text) {
    return `Translate from ${ENGLISH_NAME[srcCode]} into ${ENGLISH_NAME[dstCode]}.\n\nMessage:\n${text}`;
  }

  async function callClaude(prompt, model, onText, signal) {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal,
      headers: {
        'content-type': 'application/json',
        'x-api-key': S.key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({ model, max_tokens: 1024, stream: true, system: SYSTEM, messages: [{ role: 'user', content: prompt }] }),
    });
    if (!r.ok) {
      let msg = '';
      try { const j = await r.json(); msg = (j.error && j.error.message) || ''; } catch (e) { /* no body */ }
      const err = new Error(msg || ('HTTP ' + r.status)); err.status = r.status; throw err;
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (!data) continue;
        let ev; try { ev = JSON.parse(data); } catch (e) { continue; }
        if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') { text += ev.delta.text; onText(text); }
        else if (ev.type === 'error') { const err = new Error((ev.error && ev.error.message) || 'stream error'); err.status = 500; throw err; }
      }
    }
    return text;
  }

  function copyFor(err) {
    if (!err) return '번역 실패';
    if (err.name === 'AbortError') return '중단됨';
    if (err.status === 401 || err.status === 403) return 'API 키를 확인해 주세요';
    if (err.status === 429) return '요청이 몰렸어요. 잠시 후 다시';
    if (err.status === 404 || (err.status === 400 && /model/i.test(err.message))) return '이 키로는 쓸 수 없는 모델이에요';
    if (err.status === 400) return '요청 오류: ' + err.message.slice(0, 60);
    if (err.status === 529 || err.status === 503) return '서버 과부하. 다시 시도';
    if (err instanceof TypeError) return '네트워크 오류 (인터넷 연결 확인)';
    return '오류: ' + String(err.message || '').slice(0, 60);
  }

  async function runTranslation(m, opts) {
    opts = opts || {};
    if (m.ctl) m.ctl.abort();
    if (!S.key) {
      m.status = 'error'; m.err = '설정에서 API 키를 넣어주세요'; renderAll();
      $('openSettings').classList.add('attn'); return;
    }
    const ctl = new AbortController();
    m.ctl = ctl; m.status = 'pending'; m.err = '';
    if (!opts.keepLive) m.dst = '';
    renderAll();
    const t0 = performance.now();
    try {
      const text = await callClaude(userPrompt(m.srcLang, m.dstLang, m.src), S.model,
        (t) => { m.dst = t.trim(); m.status = 'streaming'; renderAll(); }, ctl.signal);
      if (ctl.signal.aborted) return;
      m.dst = text.trim();
      m.status = m.dst ? 'done' : 'error';
      if (!m.dst) m.err = '빈 응답';
      m.ms = Math.round(performance.now() - t0);
      m.applied = modelOf(S.model).name;
      setStatus(`${m.applied} · ${(m.ms / 1000).toFixed(1)}s`);
      if (m.finalizeOnDone) { m.finalizeOnDone = false; finishLive(m); }
      else if (opts.onDone) opts.onDone();
      else if (opts.speak !== false && m.dst && S.autoSpeak && !m.spoken) { m.spoken = true; speak(m.dst, m.dstLang, () => { if (S.autoTurn && listening === m.by) startListening(m.by === 'me' ? 'them' : 'me'); }); }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      m.status = 'error'; m.err = copyFor(e);
      if (e && (e.status === 401 || e.status === 403)) { setStatus('API 키 확인', true); $('openSettings').classList.add('attn'); }
    } finally {
      if (m.ctl === ctl) m.ctl = null;
      renderAll();
    }
  }

  function send(by, text) {
    text = (text || '').trim();
    if (!text) return;
    const m = {
      id: ++seq, by, src: text, dst: '',
      srcLang: by === 'me' ? S.me : S.them,
      dstLang: by === 'me' ? S.them : S.me,
      status: 'pending', err: '', ctl: null,
    };
    messages.push(m);
    runTranslation(m, { speak: true });
  }

  // ---- speech recognition ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let rec = null;
  let listening = null;      // 'me' | 'them' | null — who holds the mic
  let speaking = false;      // TTS playing: mic paused meanwhile
  let restartTimer = null;

  function micButton(owner) { return owner === 'me' ? $('micMe') : $('micThem'); }
  function inputOf(owner) { return owner === 'me' ? $('inputMe') : $('inputThem'); }
  function hintOf(owner) { return owner === 'me' ? $('hintMe') : $('hintThem'); }

  // Live segment: the utterance being spoken right now. It shows up as a bubble at once,
  // translation streams after a short pause, and the bubble is committed when the utterance ends.
  let live = null;            // { owner, m, lastTranslated, timer }
  const PARTIAL_DELAY = 700;  // ms of no new words before a partial translation is requested
  const SEGMENT_SILENCE = 1300; // ms of no new words before the utterance is committed (iOS never marks final on its own)
  const IS_WEBKIT = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Safari/.test(navigator.userAgent) && !/Chrome|CriOS|Android/.test(navigator.userAgent));

  function ensureLive(owner) {
    if (live && live.owner === owner) return live;
    commitLive();
    const m = {
      id: ++seq, by: owner, src: '', dst: '',
      srcLang: owner === 'me' ? S.me : S.them,
      dstLang: owner === 'me' ? S.them : S.me,
      status: 'listening', err: '', ctl: null, live: true,
    };
    messages.push(m);
    live = { owner, m, lastTranslated: '', timer: null };
    return live;
  }
  function updateLive(owner, transcript, isFinal) {
    transcript = (transcript || '').replace(/\s+/g, ' ').trim();
    if (!transcript && !isFinal) return;
    const L = ensureLive(owner);
    const m = L.m;
    if (transcript && transcript !== m.src) { m.src = transcript; renderAll(); }
    clearTimeout(L.timer); clearTimeout(L.commitTimer);
    if (isFinal) { commitLive(); return; }
    L.timer = setTimeout(() => translateLive(L, false), PARTIAL_DELAY);
    L.commitTimer = setTimeout(() => {
      // Silence: end this recognition session so the utterance is committed; onend restarts the mic.
      if (rec) { try { rec.stop(); } catch (e) { commitLive(); } } else commitLive();
    }, SEGMENT_SILENCE);
  }
  function translateLive(L, final) {
    const m = L.m;
    if (!m.src) return;
    if (m.src === L.lastTranslated && (m.status === 'done' || m.status === 'streaming' || m.status === 'pending')) {
      if (final && m.status === 'done') finishLive(m);
      return;
    }
    L.lastTranslated = m.src;
    runTranslation(m, { speak: final, onDone: final ? () => finishLive(m) : null, keepLive: !final });
  }
  function finishLive(m) {
    m.live = false;
    const other = m.by === 'me' ? 'them' : 'me';
    const handOver = () => { if (S.autoTurn && listening === m.by) startListening(other); };
    if (m.status === 'done' && m.dst && S.autoSpeak && !m.spoken) { m.spoken = true; speak(m.dst, m.dstLang, handOver); }
    else if (m.status === 'done') handOver();
    renderAll();
  }
  function commitLive() {
    if (!live) return;
    const L = live; live = null;
    clearTimeout(L.timer); clearTimeout(L.commitTimer);
    const m = L.m;
    if (!m.src) { const i = messages.indexOf(m); if (i >= 0) messages.splice(i, 1); renderAll(); return; }
    if (m.src === L.lastTranslated && m.status === 'done') { finishLive(m); return; }
    if (m.src === L.lastTranslated && (m.status === 'streaming' || m.status === 'pending')) {
      m.live = false; m.finalizeOnDone = true; renderAll(); return;
    }
    L.lastTranslated = m.src;
    m.live = false;
    runTranslation(m, { speak: true, onDone: () => finishLive(m) });
  }

  function startListening(owner) {
    if (!SR) return;
    stopListening(true);
    listening = owner;
    updateMicUI();
    spinUp();
  }
  function spinUp() {
    if (!listening || speaking) return;
    const owner = listening;
    const r = new SR();
    r.lang = langOf(owner === 'me' ? S.me : S.them).tts;
    // One utterance per session, restarted automatically: more reliable than continuous mode on iOS.
    r.continuous = !IS_WEBKIT;
    r.interimResults = true;
    r.maxAlternatives = 1;
    let gotFinal = false;
    let nResults = 0;
    r.onstart = () => setStatus('듣는 중 (엔진 시작)');
    r.onaudiostart = () => setStatus('듣는 중 (오디오 입력)');
    r.onspeechstart = () => setStatus('말소리 감지');
    r.onresult = (e) => {
      nResults++; setStatus('인식 결과 ' + nResults);
      let text = '';
      let anyFinal = false;
      // Some engines (iOS) resend the whole utterance in results[0]; others append segments.
      for (let i = 0; i < e.results.length; i++) {
        const res = e.results[i];
        text += ((res[0] && res[0].transcript) || '') + ' ';
        if (res.isFinal) anyFinal = true;
      }
      if (r.continuous) {
        // Continuous mode: only the newest non-final segment is live; final segments are committed.
        let liveText = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const res = e.results[i];
          const t = ((res[0] && res[0].transcript) || '').trim();
          if (res.isFinal) { if (t) { updateLive(owner, t, false); updateLive(owner, t, true); } }
          else liveText += t + ' ';
        }
        if (liveText.trim()) updateLive(owner, liveText, false);
      } else {
        gotFinal = anyFinal;
        updateLive(owner, text, anyFinal);
      }
    };
    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        listening = null; rec = null; updateMicUI();
        setStatus('마이크 권한이 필요해요', true);
      } else if (e.error === 'audio-capture') {
        listening = null; rec = null; updateMicUI();
        setStatus('마이크를 찾을 수 없어요', true);
      } else {
        setStatus('음성 인식 오류: ' + e.error, true);
      }
    };
    r.onend = () => {
      if (rec !== r) return;
      rec = null;
      if (nResults === 0 && !/오류/.test($('status').textContent)) setStatus('엔진 종료 (결과 없음)', true);
      if (!gotFinal) commitLive();  // the engine ended without marking final: commit what we have
      if (listening === owner && !speaking) {
        clearTimeout(restartTimer);
        restartTimer = setTimeout(spinUp, IS_WEBKIT ? 120 : 250);
      }
      updateMicUI();
    };
    rec = r;
    try { r.start(); } catch (e) { rec = null; setStatus('음성 인식을 시작할 수 없어요', true); }
    updateMicUI();
  }
  function stopListening(silent) {
    clearTimeout(restartTimer);
    listening = null;
    if (rec) { const r = rec; rec = null; try { r.onend = null; r.stop(); } catch (e) { /* ignore */ } }
    commitLive();
    if (!silent) updateMicUI();
  }
  function updateMicUI() {
    for (const o of ['me', 'them']) {
      const on = listening === o;
      micButton(o).classList.toggle('on', on);
      micButton(o).setAttribute('aria-pressed', String(on));
      const h = hintOf(o);
      const other = langOf(o === 'me' ? S.them : S.me).code;
      if (on) { h.textContent = speaking ? '▶' : '● REC'; h.classList.add('live'); }
      else { h.textContent = `→ ${other}`; h.classList.remove('live'); }
    }
  }

  // ---- speech synthesis ----
  function speak(text, code, onDone) {
    try {
      if (!('speechSynthesis' in window) || !text) { if (onDone) onDone(); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const tts = langOf(code).tts;
      u.lang = tts;
      const voices = window.speechSynthesis.getVoices() || [];
      const v = voices.find((x) => x.lang === tts) || voices.find((x) => x.lang && x.lang.replace('_', '-').slice(0, 2) === tts.slice(0, 2));
      if (v) u.voice = v;
      u.rate = 1;
      const wasListening = listening;
      const pauseMic = () => {
        speaking = true;
        if (rec) { const r = rec; rec = null; try { r.onend = null; r.stop(); } catch (e) { /* ignore */ } }
        updateMicUI();
      };
      let doneCalled = false;
      const resumeMic = () => {
        if (!speaking) return;
        speaking = false;
        if (onDone && !doneCalled) { doneCalled = true; onDone(); }
        if (listening && !rec) { clearTimeout(restartTimer); restartTimer = setTimeout(spinUp, 300); }
        updateMicUI();
      };
      u.onstart = pauseMic;
      u.onend = resumeMic;
      u.onerror = resumeMic;
      pauseMic();
      window.speechSynthesis.speak(u);
      // Safety: some browsers never fire onend for cancelled utterances.
      setTimeout(() => { if (speaking && !window.speechSynthesis.speaking) resumeMic(); }, Math.min(30000, 1500 + text.length * 120));
    } catch (e) { speaking = false; if (onDone) onDone(); }
  }

  // ---- render ----
  const ICON_SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_RETRY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>';
  const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function renderPanel(owner) {
    const log = owner === 'me' ? $('logMe') : $('logThem');
    const ownLang = owner === 'me' ? S.me : S.them;
    const stuck = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    if (!messages.length) { log.innerHTML = `<p class="empty">${esc(langOf(ownLang).empty)}</p>`; return; }
    log.innerHTML = messages.map((m) => {
      const own = m.by === owner;
      const primary = own ? m.src : m.dst;
      const secondary = own ? m.dst : m.src;
      const busy = m.status === 'pending' || m.status === 'streaming' || m.status === 'listening';
      const waiting = !own && !m.dst && busy;
      const primaryHtml = waiting ? '<span class="dots"><i></i><i></i><i></i></span>' : esc(primary);
      let secondaryHtml = '';
      if (own) secondaryHtml = (!m.dst && busy) ? '<span class="dots"><i></i><i></i><i></i></span>' : (m.dst ? esc(secondary) : '');
      else secondaryHtml = esc(secondary);
      let meta = '<span class="meta"></span>';
      if (m.status === 'error') meta = `<span class="meta err">${esc(m.err)}</span>`;
      else if (m.live) meta = `<span class="meta live">${own ? '● ' : ''}…</span>`;
      else if (m.status === 'done' && m.applied) meta = `<span class="meta">${esc(m.applied)} · ${(m.ms / 1000).toFixed(1)}s</span>`;
      const actions = [
        (primary && !waiting) ? `<button type="button" class="icon-btn" data-speak="${m.id}" data-owner="${owner}" aria-label="Speak">${ICON_SPEAK}</button>` : '',
        (busy && !m.live) ? `<button type="button" class="icon-btn" data-stop="${m.id}" aria-label="Stop">${ICON_STOP}</button>` : '',
        m.status === 'error' ? `<button type="button" class="icon-btn" data-retry="${m.id}" aria-label="Retry">${ICON_RETRY}</button>` : '',
      ].join('');
      return `<div class="msg ${own ? 'own' : 'other'}${m.live ? ' is-live' : ''}" data-id="${m.id}">
        <div class="primary" lang="${esc(own ? m.srcLang : m.dstLang)}">${primaryHtml}</div>
        ${secondaryHtml ? `<div class="secondary" lang="${esc(own ? m.dstLang : m.srcLang)}">${secondaryHtml}</div>` : ''}
        <div class="row">${meta}<span class="actions">${actions}</span></div>
      </div>`;
    }).join('');
    if (stuck) log.scrollTop = log.scrollHeight;
  }
  function renderAll() { renderPanel('me'); renderPanel('them'); }

  function renderChrome() {
    const me = langOf(S.me), them = langOf(S.them);
    $('codeMe').textContent = me.code; $('nameMe').textContent = me.name;
    $('codeThem').textContent = them.code; $('nameThem').textContent = them.name;
    $('pairMe').textContent = me.code; $('pairThem').textContent = them.code;
    $('inputMe').placeholder = me.ph; $('inputThem').placeholder = them.ph;
    $('modelQuick').value = S.model;
    $('selMe').value = S.me; $('selThem').value = S.them;
    $('apiKey').value = S.key;
    $('autoSpeak').setAttribute('aria-checked', String(S.autoSpeak));
    $('autoTurn').setAttribute('aria-checked', String(S.autoTurn));
    for (const el of $('models').querySelectorAll('.model')) el.setAttribute('aria-checked', String(el.dataset.model === S.model));
    $('openSettings').classList.toggle('attn', !S.key);
    updateMicUI();
  }
  function setStatus(t, warn) { const s = $('status'); s.textContent = t; s.classList.toggle('warn', !!warn); }

  // ---- build controls ----
  for (const sel of [$('selMe'), $('selThem')]) sel.innerHTML = LANGS.map((l) => `<option value="${l.code}">${esc(l.name)}</option>`).join('');
  $('modelQuick').innerHTML = MODELS.map((m) => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
  $('models').innerHTML = MODELS.map((m) => `
    <button type="button" class="model" role="radio" aria-checked="false" data-model="${m.id}">
      <span class="radio"></span>
      <span><span class="name">${esc(m.name)}</span><br><span class="note">${esc(m.note)}</span></span>
      <span class="lat">${esc(m.lat)}</span>
    </button>`).join('');

  // ---- events ----
  $('formMe').addEventListener('submit', (e) => { e.preventDefault(); const i = $('inputMe'); if (i.classList.contains('interim')) return; send('me', i.value); i.value = ''; });
  $('formThem').addEventListener('submit', (e) => { e.preventDefault(); const i = $('inputThem'); if (i.classList.contains('interim')) return; send('them', i.value); i.value = ''; });
  $('inputThem').addEventListener('focus', () => $('app').classList.add('kb-them'));
  $('inputThem').addEventListener('blur', () => $('app').classList.remove('kb-them'));
  $('inputMe').addEventListener('focus', () => $('app').classList.add('kb-me'));
  $('inputMe').addEventListener('blur', () => $('app').classList.remove('kb-me'));
  $('inputMe').addEventListener('input', (e) => e.target.classList.remove('interim'));
  $('inputThem').addEventListener('input', (e) => e.target.classList.remove('interim'));

  for (const o of ['me', 'them']) {
    micButton(o).addEventListener('click', () => {
      if (!SR) { setStatus('이 브라우저는 음성 인식을 지원하지 않아요', true); return; }
      if (!S.key) { $('openSettings').classList.add('attn'); openSheet(); return; }
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
      speaking = false;
      if (listening === o) stopListening(); else startListening(o);
    });
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.speak) {
      const m = messages.find((x) => x.id === Number(b.dataset.speak)); if (!m) return;
      const own = m.by === b.dataset.owner;
      speak(own ? m.src : m.dst, own ? m.srcLang : m.dstLang);
    } else if (b.dataset.retry) {
      const m = messages.find((x) => x.id === Number(b.dataset.retry)); if (m) runTranslation(m);
    } else if (b.dataset.stop) {
      const m = messages.find((x) => x.id === Number(b.dataset.stop));
      if (m && m.ctl) { m.ctl.abort(); m.status = m.dst ? 'done' : 'error'; m.err = m.dst ? '' : '중단됨'; m.applied = m.dst ? modelOf(S.model).name : ''; m.ms = m.ms || 0; renderAll(); }
    }
  });

  $('modelQuick').addEventListener('change', (e) => { S.model = e.target.value; saveSettings(); renderChrome(); });
  $('models').addEventListener('click', (e) => { const b = e.target.closest('.model'); if (!b) return; S.model = b.dataset.model; saveSettings(); renderChrome(); });
  $('selMe').addEventListener('change', (e) => { S.me = e.target.value; saveSettings(); renderChrome(); renderAll(); if (listening === 'me') startListening('me'); else commitLive(); });
  $('selThem').addEventListener('change', (e) => { S.them = e.target.value; saveSettings(); renderChrome(); renderAll(); if (listening === 'them') startListening('them'); else commitLive(); });
  $('swapLang').addEventListener('click', () => { const t = S.me; S.me = S.them; S.them = t; saveSettings(); renderChrome(); renderAll(); if (listening) startListening(listening); });
  $('apiKey').addEventListener('input', (e) => { S.key = e.target.value.trim(); saveSettings(); $('openSettings').classList.toggle('attn', !S.key); if (S.key) setStatus(''); });
  $('autoSpeak').addEventListener('click', () => { S.autoSpeak = !S.autoSpeak; saveSettings(); renderChrome(); });
  $('autoTurn').addEventListener('click', () => { S.autoTurn = !S.autoTurn; saveSettings(); renderChrome(); });

  function openSheet() { $('sheet').hidden = false; $('scrim').hidden = false; }
  function closeSheet() { $('sheet').hidden = true; $('scrim').hidden = true; }
  $('openSettings').addEventListener('click', openSheet);
  $('closeSettings').addEventListener('click', closeSheet);
  $('scrim').addEventListener('click', closeSheet);
  function clearConversation() {
    stopListening(true);
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    speaking = false;
    for (const m of messages) if (m.ctl) m.ctl.abort();
    messages.length = 0; renderAll(); setStatus(''); updateMicUI();
  }
  let resetArmed = null;
  $('resetChat').addEventListener('click', () => {
    if (resetArmed) { clearTimeout(resetArmed); resetArmed = null; $('resetChat').classList.remove('attn'); clearConversation(); setStatus('초기화됨'); return; }
    $('resetChat').classList.add('attn'); setStatus('한 번 더 누르면 초기화', true);
    resetArmed = setTimeout(() => { resetArmed = null; $('resetChat').classList.remove('attn'); setStatus(''); }, 3000);
  });
  $('clearChat').addEventListener('click', () => {
    clearConversation(); closeSheet();
  });

  // Keep the screen awake while interpreting.
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { /* not granted */ }
  }
  document.addEventListener('click', keepAwake, { once: true });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  // ---- boot ----
  renderChrome();
  renderAll();
  if (!SR) {
    $('srSupport').textContent = '이 브라우저는 음성 인식(Web Speech API)을 지원하지 않습니다. Android는 Chrome, iPhone은 Safari에서 열어주세요. 텍스트 입력은 그대로 됩니다.';
    for (const o of ['me', 'them']) micButton(o).disabled = true;
    setStatus('음성 인식 미지원 브라우저', true);
  } else {
    $('srSupport').textContent = '음성 인식은 브라우저 내장 기능(Android: Google, iPhone: Apple)을 사용합니다. 마이크 권한을 허용해 주세요.';
    if (!S.key) setStatus('설정에서 API 키 입력', true);
  }
  if (window.location.protocol === 'file:' && /iPhone|iPad/.test(navigator.userAgent)) setStatus('iPhone은 https 주소로 열어야 마이크가 켜져요', true);
  try { window.speechSynthesis && window.speechSynthesis.getVoices(); } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>
